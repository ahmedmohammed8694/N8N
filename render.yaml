databases:
  - name: n8n-db
    databaseName: n8n
    user: n8n
    plan: free

services:
  - type: web
    name: n8n
    runtime: image
    plan: free
    image:
      url: docker.io/n8nio/n8n:latest
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "5678"
      - key: N8N_PORT
        value: "5678"
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: N8N_DEFAULT_BINARY_DATA_MODE
        value: "filesystem"
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: "none"
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "48"
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
      - key: WEBHOOK_URL
        value: https://hosting.mdahmed08061994.workers.dev/
      - key: N8N_SECURE_COOKIE
        value: "false"
      - key: GENERIC_TIMEZONE
        value: "Asia/Kolkata"
      - key: TZ
        value: "Asia/Kolkata"
